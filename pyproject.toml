[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-training-tracker"
version = "0.1.0"
description = "Employee training register: compliance and scheduling over an HR data export."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.146.0",
    "jinja2==3.1.6",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.14",
    "ipykernel>=6.29",
    "nbconvert>=7",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
