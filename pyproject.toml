[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-training-tracker"
version = "0.1.0"
description = "Employee training register: compliance and scheduling over an HR data export."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.3",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.setuptools]
# No importable package yet - notebooks only. The src/ module arrives later (see CLAUDE.md).
py-modules = []

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
